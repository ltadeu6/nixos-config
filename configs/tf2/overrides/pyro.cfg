// Pyro: airblast ao apertar, troca de arma ao soltar (sem "wait", que e
// desligado na maioria dos servidores).
alias +pyro_flare "+attack2"
alias -pyro_flare "-attack2; slot2"   // airblast -> flare/shotgun
alias +pyro_axe   "+attack2"
alias -pyro_axe   "-attack2; slot3"   // airblast -> machado (puff and sting)
bind MOUSE4 "+pyro_flare"
bind MOUSE5 "+pyro_axe"
